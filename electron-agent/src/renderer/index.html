<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WiFi Device Manager</title><style>body{font-family:Arial;background:#f5f7fb;margin:0;padding:28px;color:#172033}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:26px;max-width:470px;margin:auto;box-shadow:0 12px 30px #0000000b}p{color:#667085;line-height:1.5}.device{background:#f8fafc;padding:12px;border-radius:10px;margin:15px 0;font-size:14px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d0d5dd;border-radius:10px;margin:8px 0 12px}button{width:100%;padding:12px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700}.msg{margin-top:12px}</style></head><body><div class="card"><h1>WiFi Device Manager</h1><p>This company-managed agent requires enrollment. It reports authorized network metadata to your administrator and never reads or transmits saved Wi-Fi passwords.</p><div class="device"><b>Device:</b> <span id="device">Loading…</span><br><b>Status:</b> <span id="status">Checking…</span></div><div id="enroll"><label>Enrollment code</label><input id="code" maxlength="32" placeholder="Code from administrator"><button id="btn">Register this device</button></div><div class="msg" id="msg"></div></div><script>const d=document.querySelector('#device'),s=document.querySelector('#status'),e=document.querySelector('#enroll'),m=document.querySelector('#msg');async function init(){const x=await window.agent.getStatus();d.textContent=x.deviceId;s.textContent=x.registered?'Registered':'Awaiting enrollment';if(x.registered)e.style.display='none'}document.querySelector('#btn').onclick=async()=>{m.textContent='Registering…';try{await window.agent.registerDevice(document.querySelector('#code').value);m.textContent='Registered. The agent is running in the background.';e.style.display='none';s.textContent='Registered'}catch(err){m.textContent=err.message||'Registration failed'}};init();</script></body></html>
